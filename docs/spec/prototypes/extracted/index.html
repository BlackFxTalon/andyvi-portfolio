<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AndyVi — Главная / Pixel Perfect Final</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Tektur:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: oklch(7% 0.018 250);
      --surface: oklch(10% 0.022 250);
      --fg: oklch(96% 0.015 240);
      --muted: oklch(75% 0.018 240);
      --border: oklch(66% 0.065 235);
      --accent: oklch(74% 0.12 225);
      --font-heading: "Tektur", "Arial Narrow", system-ui, sans-serif;
      --font-body: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      --font-mono: "JetBrains Mono", "IBM Plex Mono", ui-monospace, Menlo, monospace;
      --cold-white: #f4f8ff;
      --cyan: #b7e8ff;
      --deep: #00040a;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #02050a;
      color: var(--fg);
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      display: grid;
      place-items: center;
    }

    .stage-shell {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 30% 36%, rgba(69, 119, 144, 0.16), transparent 28%),
        radial-gradient(circle at 70% 45%, rgba(68, 153, 205, 0.08), transparent 32%),
        #010308;
    }

    .frame {
      position: absolute;
      left: 0;
      top: 0;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: var(--bg);
      transform-origin: top left;
      isolation: isolate;
      user-select: none;
    }

    .frame::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 9;
      pointer-events: none;
      display: none;
    }

    .frame::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 8;
      pointer-events: none;
      background:
        linear-gradient(90deg, rgba(0,0,0,0.08) 0%, transparent 29%, rgba(0,4,10,0.74) 45%, rgba(0,3,8,0.97) 58%, rgba(0,2,7,0.98) 100%),
        radial-gradient(circle at 54% 38%, transparent 0 28%, rgba(0,0,0,0.54) 70%),
        linear-gradient(180deg, rgba(0,0,0,0.52) 0%, transparent 18%, transparent 74%, rgba(0,0,0,0.72) 100%);
    }

    .layer {
      position: absolute;
      pointer-events: none;
    }

    .reference-locked {
      inset: 0;
      z-index: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
    }

    .bg-photo {
      left: 0;
      top: 0;
      z-index: 1;
      width: 960px;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      opacity: 0.98;
    }

    .blue-smoke {
      left: 0;
      top: 0;
      width: 930px;
      height: 1080px;
      z-index: 4;
      background:
        radial-gradient(circle at 18% 44%, rgba(56, 117, 145, 0.18), transparent 24%),
        radial-gradient(circle at 39% 34%, rgba(139, 202, 227, 0.08), transparent 19%);
      mix-blend-mode: normal;
      opacity: 0.4;
    }

    .right-clean-plate {
      left: 930px;
      top: 0;
      width: 990px;
      height: 1080px;
      z-index: 19;
      background: #00040a;
      box-shadow: -42px 0 96px rgba(0, 4, 10, 0.9);
    }

    .grain {
      display: none;
    }

    .topbar,
    .hero,
    .cta-zone,
    .metrics,
    .right-ruler,
    .hud-decor {
      position: absolute;
      z-index: 20;
    }

    .topbar {
      left: 0;
      top: 0;
      width: 1920px;
      height: 122px;
      transform-origin: top left;
    }

    .mobile-nav {
      position: absolute;
      z-index: 25;
      transform-origin: top left;
    }

    .logo {
      position: absolute;
      left: 72px;
      top: 50px;
      width: 210px;
      height: 36px;
      color: var(--cold-white);
      font-family: var(--font-heading);
      font-size: 30px;
      font-weight: 500;
      line-height: 1;
      text-decoration: none;
      text-shadow: 0 0 10px rgba(180, 225, 255, 0.18);
    }

    .logo-word {
      position: relative;
      display: inline-block;
    }

    .logo-word.load-glitch-logo {
      isolation: isolate;
      animation: logo-glitch-lock 980ms steps(1, end) 70ms 1 both;
    }

    .logo-word.load-glitch-logo::before,
    .logo-word.load-glitch-logo::after {
      content: attr(data-glitch);
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0;
      text-shadow: none;
    }

    .logo-word.load-glitch-logo::before {
      color: #8feaff;
      clip-path: inset(0 0 58% 0);
      animation: logo-glitch-cyan 980ms steps(1, end) 70ms 1 both;
    }

    .logo-word.load-glitch-logo::after {
      color: #ff5f82;
      clip-path: inset(48% 0 0 0);
      animation: logo-glitch-rose 980ms steps(1, end) 70ms 1 both;
    }

    @keyframes logo-glitch-lock {
      0%, 11% {
        transform: translate3d(0, 0, 0);
        text-shadow: 0 0 10px rgba(180, 225, 255, 0.18);
      }
      12% {
        transform: translate3d(-5px, 0, 0) skewX(-8deg);
        text-shadow:
          7px 0 0 rgba(143, 234, 255, 0.55),
          -5px 0 0 rgba(255, 95, 130, 0.36),
          0 0 16px rgba(181, 232, 255, 0.34);
      }
      18% {
        transform: translate3d(4px, -1px, 0) skewX(5deg);
      }
      23% {
        transform: translate3d(0, 0, 0);
        text-shadow: 0 0 10px rgba(180, 225, 255, 0.18);
      }
      35% {
        transform: translate3d(2px, 0, 0);
        text-shadow:
          0 0 2px rgba(244, 248, 255, 0.9),
          0 0 18px rgba(143, 234, 255, 0.34);
      }
      42%, 100% {
        transform: translate3d(0, 0, 0);
        text-shadow: 0 0 10px rgba(180, 225, 255, 0.18);
      }
    }

    @keyframes logo-glitch-cyan {
      0%, 10% {
        opacity: 0;
        transform: translate3d(0, 0, 0);
        clip-path: inset(0 0 100% 0);
      }
      11% {
        opacity: 0.88;
        transform: translate3d(13px, -1px, 0);
        clip-path: inset(0 0 58% 0);
      }
      17% {
        opacity: 0.52;
        transform: translate3d(-8px, 1px, 0);
        clip-path: inset(24% 0 38% 0);
      }
      22% {
        opacity: 0;
        transform: translate3d(0, 0, 0);
        clip-path: inset(0 0 100% 0);
      }
      34% {
        opacity: 0.68;
        transform: translate3d(7px, 0, 0);
        clip-path: inset(68% 0 12% 0);
      }
      39%, 100% {
        opacity: 0;
        transform: translate3d(0, 0, 0);
        clip-path: inset(0 0 100% 0);
      }
    }

    @keyframes logo-glitch-rose {
      0%, 13% {
        opacity: 0;
        transform: translate3d(0, 0, 0);
        clip-path: inset(0 0 100% 0);
      }
      14% {
        opacity: 0.7;
        transform: translate3d(-12px, 1px, 0);
        clip-path: inset(48% 0 6% 0);
      }
      19% {
        opacity: 0.55;
        transform: translate3d(8px, 0, 0);
        clip-path: inset(12% 0 66% 0);
      }
      24% {
        opacity: 0;
        transform: translate3d(0, 0, 0);
        clip-path: inset(0 0 100% 0);
      }
      36% {
        opacity: 0.64;
        transform: translate3d(-6px, 0, 0);
        clip-path: inset(78% 0 0 0);
      }
      41%, 100% {
        opacity: 0;
        transform: translate3d(0, 0, 0);
        clip-path: inset(0 0 100% 0);
      }
    }

    .nav {
      position: absolute;
      left: 1130px;
      top: 54px;
      display: grid;
      grid-template-columns: 118px 118px 124px 130px;
      column-gap: 42px;
      align-items: start;
      height: 80px;
      font-family: var(--font-heading);
      font-size: 18px;
      font-weight: 500;
      line-height: 1;
      text-transform: uppercase;
      color: rgba(244, 248, 255, 0.92);
    }

    .nav a {
      display: block;
      position: relative;
      color: rgba(244, 248, 255, 0.92);
      text-decoration: none;
      white-space: nowrap;
      text-shadow: 0 0 9px rgba(199, 232, 255, 0.22);
      outline: none;
      transition:
        color 180ms ease,
        text-shadow 180ms ease,
        transform 180ms ease;
    }

    .nav a:visited {
      color: rgba(244, 248, 255, 0.78);
    }

    .nav a::before,
    .nav a::after {
      content: "";
      position: absolute;
      left: 0;
      pointer-events: none;
      opacity: 0;
      transition:
        opacity 180ms ease,
        transform 180ms ease;
    }

    .nav a::before {
      top: -14px;
      width: 34px;
      height: 1px;
      background: linear-gradient(90deg, rgba(186, 235, 255, 0), rgba(186, 235, 255, 0.82));
      box-shadow: 0 0 12px rgba(172, 228, 255, 0.38);
      transform: translateX(-10px) scaleX(0.55);
      transform-origin: left center;
    }

    .nav a::after {
      bottom: -14px;
      width: 72px;
      height: 1px;
      background: linear-gradient(90deg, rgba(241, 248, 255, 0.9), rgba(143, 220, 255, 0.16), transparent);
      transform: translateX(14px) scaleX(0);
      transform-origin: left center;
    }

    .nav a:hover,
    .nav a:focus-visible,
    .nav a[aria-current="page"] {
      color: #fff;
      text-shadow:
        0 0 10px rgba(204, 239, 255, 0.44),
        0 0 22px rgba(119, 201, 255, 0.2);
    }

    .nav a:hover,
    .nav a:focus-visible {
      transform: translateY(-2px);
    }

    .nav a:hover::before,
    .nav a:hover::after,
    .nav a:focus-visible::before,
    .nav a:focus-visible::after,
    .nav a[aria-current="page"]::before,
    .nav a[aria-current="page"]::after {
      opacity: 1;
      transform: translateX(0) scaleX(1);
    }

    .nav a:focus-visible {
      outline: 1px solid rgba(178, 231, 255, 0.58);
      outline-offset: 8px;
    }

    .nav-line {
      position: absolute;
      left: 1054px;
      top: 98px;
      width: 804px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(198, 224, 241, 0.1) 10%, rgba(198, 224, 241, 0.22) 74%, transparent);
    }

    .nav-line::after {
      content: "";
      position: absolute;
      right: -28px;
      top: -12px;
      width: 42px;
      height: 24px;
      border-bottom: 1px solid rgba(191, 220, 238, 0.18);
      border-right: 1px solid rgba(191, 220, 238, 0.22);
      transform: skewX(-38deg);
    }

    .menu-button {
      display: none;
      position: absolute;
      right: 40px;
      top: 44px;
      width: 44px;
      height: 44px;
      border: 0;
      background: rgba(0, 6, 14, 0.28);
      clip-path: polygon(10px 0, 100% 0, 100% 34px, 34px 100%, 0 100%, 0 10px);
      cursor: pointer;
      overflow: hidden;
      transition: transform 180ms ease, background 180ms ease, box-shadow 180ms ease;
    }

    .menu-button-orbit {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      opacity: 1;
      padding: 1px;
      clip-path: inherit;
      overflow: hidden;
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      mask-composite: exclude;
      filter: drop-shadow(0 0 7px rgba(184, 240, 255, 0.52)) drop-shadow(0 0 14px rgba(70, 196, 255, 0.18));
      transition: filter 220ms ease, opacity 220ms ease;
    }

    .menu-button-orbit::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 170%;
      height: 170%;
      background: conic-gradient(
        from 0deg,
        rgba(128, 219, 255, 0.5) 0deg,
        rgba(128, 219, 255, 0.4) 112deg,
        rgba(172, 236, 255, 0.68) 138deg,
        rgba(246, 253, 255, 0.98) 172deg,
        rgba(92, 216, 255, 0.96) 184deg,
        rgba(240, 252, 255, 0.88) 202deg,
        rgba(132, 219, 255, 0.5) 244deg,
        rgba(128, 219, 255, 0.5) 360deg
      );
      transform: translate(-50%, -50%) rotate(0deg);
      transform-origin: center;
      animation: none;
    }

    .menu-button:hover,
    .menu-button:focus-visible {
      transform: translateY(-1px);
      background: rgba(2, 16, 30, 0.54);
      box-shadow: inset 0 0 14px rgba(158, 220, 255, 0.12), 0 0 22px rgba(126, 207, 255, 0.22);
      outline: none;
    }

    .menu-button:hover .menu-button-orbit,
    .menu-button:focus-visible .menu-button-orbit {
      filter: drop-shadow(0 0 8px rgba(117, 216, 255, 0.46)) drop-shadow(0 0 18px rgba(56, 187, 255, 0.18));
    }

    .menu-button:hover .menu-button-orbit::before,
    .menu-button:focus-visible .menu-button-orbit::before {
      background: conic-gradient(
        from 0deg,
        transparent 0deg,
        transparent 104deg,
        rgba(109, 211, 255, 0.18) 130deg,
        rgba(246, 253, 255, 0.98) 168deg,
        rgba(73, 219, 255, 1) 184deg,
        rgba(248, 253, 255, 0.9) 204deg,
        transparent 252deg,
        transparent 360deg
      );
      animation: cta-border-orbit 1.45s linear infinite;
    }

    .menu-button:focus-visible {
      outline: 1px solid rgba(205, 242, 255, 0.78);
      outline-offset: 5px;
    }

    .menu-button span {
      position: absolute;
      left: 12px;
      width: 20px;
      height: 1px;
      background: rgba(244, 248, 255, 0.86);
      box-shadow: 0 0 9px rgba(170, 230, 255, 0.35);
      transition: transform 180ms ease, opacity 180ms ease;
      z-index: 2;
    }

    .menu-button span:nth-of-type(1) { top: 15px; }
    .menu-button span:nth-of-type(2) { top: 22px; }
    .menu-button span:nth-of-type(3) { top: 29px; }
    .menu-button[aria-expanded="true"] span:nth-of-type(1) { transform: translateY(7px) rotate(45deg); }
    .menu-button[aria-expanded="true"] span:nth-of-type(2) { opacity: 0; }
    .menu-button[aria-expanded="true"] span:nth-of-type(3) { transform: translateY(-7px) rotate(-45deg); }

    .mobile-nav {
      display: none;
      top: 98px;
      right: 40px;
      width: 214px;
      padding: 18px 18px 20px;
      background: rgba(0, 5, 12, 0.92);
      border: 1px solid rgba(211, 240, 255, 0.24);
      clip-path: polygon(14px 0, 100% 0, 100% calc(100% - 16px), calc(100% - 18px) 100%, 0 100%, 0 14px);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.42), 0 0 24px rgba(104, 208, 255, 0.12);
      opacity: 0;
      transform: translateY(-8px);
      pointer-events: none;
      transition: opacity 160ms ease, transform 160ms ease;
    }

    .mobile-nav.is-open {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .mobile-nav a {
      display: block;
      padding: 12px 0;
      color: rgba(244, 248, 255, 0.88);
      font-family: var(--font-heading);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-decoration: none;
      text-transform: uppercase;
      border-bottom: 1px solid rgba(211, 240, 255, 0.1);
    }

    .mobile-nav a:last-child { border-bottom: 0; }

    .hero {
      left: 980px;
      top: 213px;
      width: 820px;
      height: 500px;
    }

    .eyebrow {
      position: absolute;
      left: 0;
      top: 0;
      font-family: var(--font-heading);
      font-size: 24px;
      font-weight: 500;
      line-height: 1;
      color: #f4f8ff;
      text-transform: uppercase;
      text-shadow: 0 0 12px rgba(189, 232, 255, 0.25);
    }

    .eyebrow-rule {
      position: absolute;
      left: 0;
      top: 43px;
      width: 630px;
      height: 1px;
      background: linear-gradient(90deg, rgba(225, 246, 255, 0.38), rgba(225, 246, 255, 0.18) 58%, transparent);
      box-shadow: 0 0 12px rgba(177, 229, 255, 0.22);
    }

    .eyebrow-rule::before {
      content: "";
      position: absolute;
      left: 0;
      top: -4px;
      width: 78px;
      height: 8px;
      background:
        repeating-linear-gradient(110deg, rgba(179, 231, 255, 0.62) 0 4px, transparent 4px 9px);
      opacity: 0.6;
      clip-path: polygon(6px 0, 100% 0, calc(100% - 10px) 100%, 0 100%);
    }

    .eyebrow-rule::after {
      content: "";
      position: absolute;
      right: -74px;
      top: -1px;
      width: 78px;
      height: 24px;
      border-top: 1px solid rgba(206, 236, 249, 0.2);
      border-right: 1px solid rgba(206, 236, 249, 0.28);
      transform: skewX(38deg);
    }

    .hero-title {
      position: absolute;
      left: -4px;
      top: 88px;
      width: 820px;
      margin: 0;
      font-family: var(--font-heading);
      font-size: 92px;
      font-weight: 800;
      line-height: 1.22;
      letter-spacing: 0.018em;
      text-transform: uppercase;
      color: var(--cold-white);
      text-shadow:
        0 0 2px rgba(255, 255, 255, 0.9),
        0 0 16px rgba(168, 223, 255, 0.3),
        0 0 34px rgba(97, 177, 230, 0.18);
    }

    .hero-title span {
      display: block;
      white-space: nowrap;
    }

    .hero-title .load-glitch {
      position: relative;
      isolation: isolate;
    }

    .hero-title .load-glitch::before,
    .hero-title .load-glitch::after {
      content: attr(data-glitch);
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0;
      color: var(--cold-white);
      text-shadow: none;
    }

    .hero-title .load-glitch::before {
      color: #8feaff;
      clip-path: inset(6% 0 62% 0);
      animation: title-glitch-cyan 920ms steps(1, end) 80ms 1 both;
    }

    .hero-title .load-glitch::after {
      color: #ff6f8d;
      clip-path: inset(54% 0 18% 0);
      animation: title-glitch-rose 920ms steps(1, end) 80ms 1 both;
    }

    @keyframes title-glitch-cyan {
      0%, 11% {
        opacity: 0;
        transform: translate3d(0, 0, 0);
        clip-path: inset(0 0 100% 0);
      }
      12% {
        opacity: 0.85;
        transform: translate3d(-18px, -2px, 0);
        clip-path: inset(6% 0 72% 0);
      }
      18% {
        opacity: 0.65;
        transform: translate3d(12px, 0, 0);
        clip-path: inset(42% 0 38% 0);
      }
      24% {
        opacity: 0;
        transform: translate3d(0, 0, 0);
        clip-path: inset(0 0 100% 0);
      }
      36% {
        opacity: 0.72;
        transform: translate3d(-10px, 3px, 0);
        clip-path: inset(68% 0 10% 0);
      }
      42%, 100% {
        opacity: 0;
        transform: translate3d(0, 0, 0);
        clip-path: inset(0 0 100% 0);
      }
    }

    @keyframes title-glitch-rose {
      0%, 14% {
        opacity: 0;
        transform: translate3d(0, 0, 0);
        clip-path: inset(0 0 100% 0);
      }
      15% {
        opacity: 0.72;
        transform: translate3d(14px, 2px, 0);
        clip-path: inset(55% 0 25% 0);
      }
      21% {
        opacity: 0.6;
        transform: translate3d(-8px, -1px, 0);
        clip-path: inset(22% 0 58% 0);
      }
      27% {
        opacity: 0;
        transform: translate3d(0, 0, 0);
        clip-path: inset(0 0 100% 0);
      }
      39% {
        opacity: 0.78;
        transform: translate3d(20px, 0, 0);
        clip-path: inset(78% 0 4% 0);
      }
      45%, 100% {
        opacity: 0;
        transform: translate3d(0, 0, 0);
        clip-path: inset(0 0 100% 0);
      }
    }

    .hero-title .load-glitch-deep {
      position: relative;
      isolation: isolate;
      animation: title-deep-lock 1180ms steps(1, end) 120ms 1 both;
    }

    .hero-title .load-glitch-deep::before,
    .hero-title .load-glitch-deep::after {
      content: attr(data-glitch);
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0;
      color: var(--cold-white);
      text-shadow: none;
    }

    .hero-title .load-glitch-deep::before {
      color: #91ecff;
      clip-path: inset(14% 0 64% 0);
      animation: title-deep-slice-a 1180ms steps(1, end) 120ms 1 both;
    }

    .hero-title .load-glitch-deep::after {
      color: #ff567b;
      clip-path: inset(58% 0 18% 0);
      animation: title-deep-slice-b 1180ms steps(1, end) 120ms 1 both;
    }

    @keyframes title-deep-lock {
      0%, 9% {
        transform: translate3d(0, 0, 0);
        text-shadow:
          0 0 2px rgba(255, 255, 255, 0.9),
          0 0 16px rgba(168, 223, 255, 0.3),
          0 0 34px rgba(97, 177, 230, 0.18);
      }
      10% {
        transform: translate3d(0, -2px, 0) skewX(-5deg);
        text-shadow: -12px 0 0 rgba(103, 239, 255, 0.38), 9px 0 0 rgba(255, 82, 123, 0.32);
      }
      16% {
        transform: translate3d(9px, 1px, 0) skewX(3deg);
        text-shadow: 14px 0 0 rgba(103, 239, 255, 0.28), -8px 0 0 rgba(255, 82, 123, 0.28);
      }

      mix-blend-mode: screen;
      transform: translateX(-120%) skewX(-12deg);
    }

    body::after {
      background:
        radial-gradient(circle at 52% 44%, rgba(183, 232, 255, 0.18), transparent 32%),
        linear-gradient(90deg, rgba(0, 4, 10, 0.94), rgba(0, 7, 14, 0.72) 45%, rgba(0, 4, 10, 0.98)),
        repeating-linear-gradient(0deg, rgba(183, 232, 255, 0.08) 0 1px, transparent 1px 7px);
      transform: scaleX(0);
      transform-origin: right center;
    }

    body.is-page-entering::before {
      animation: page-scan-enter 620ms cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    body.is-page-entering::after {
      animation: page-vignette-enter 620ms ease-out both;
    }

    body.is-page-exiting::before {
      animation: page-scan-exit 440ms cubic-bezier(0.65, 0, 0.35, 1) both;
    }

    body.is-page-exiting::after {
      animation: page-vignette-exit 440ms cubic-bezier(0.65, 0, 0.35, 1) both;

      22% { opacity: 0.95; }
      100% { opacity: 0; transform: translateX(120%) skewX(-12deg); }

      0% { opacity: 0.76; transform: scaleX(1); }
      100% { opacity: 0; transform: scaleX(0.12); }

    @keyframes page-scan-exit {
      0% { opacity: 0; transform: translateX(-120%) skewX(-12deg); }

      position: absolute;
      inset: 0;
      display: none;
      width: 100%;
      height: 100%;
      border: 0;
      background: #010308;
    }

    @media (max-width: 1199px) {
      body {
        display: block;
        place-items: initial;
      }

      .stage-shell {
        display: none;
      }

      .responsive-shell {
        display: block;
      }
    }

    @media (min-width: 768px) and (max-width: 1199px) {
      .responsive-frame.tablet {
        display: block;
      }
    }

    @media (max-width: 767px) {
      .responsive-frame.mobile {
        display: block;
      }
    }
  </style>
</head>
<body>
  <div class="responsive-shell" aria-label="AndyVi responsive hero">
    <iframe class="responsive-frame tablet" src="andyvi-tablet.html" title="AndyVi tablet hero"></iframe>
    <iframe class="responsive-frame mobile" src="andyvi-mobile.html" title="AndyVi mobile hero"></iframe>
  </div>

  <div class="stage-shell">
    <header class="topbar" data-layer="02_HEADER">
      <a class="logo" href="index.html" aria-label="AndyVi, на главную" data-layer="Logo / AndyVi"><span class="logo-word">AndyVi</span></a>
      <button class="menu-button" id="menuButton" type="button" aria-label="Открыть меню" aria-expanded="false" aria-controls="mobileNav">
        <i class="menu-button-orbit" aria-hidden="true"></i>
        <span></span><span></span><span></span>
      </button>
      <nav class="nav" aria-label="Главная навигация">
        <a href="works.html" data-layer="Nav / Работы">РАБОТЫ</a>
        <a href="about.html" data-layer="Nav / Обо мне">ОБО МНЕ</a>
        <a href="process.html" data-layer="Nav / Процесс">ПРОЦЕСС</a>
        <a href="contacts.html" data-layer="Nav / Контакты">КОНТАКТЫ</a>
      </nav>
      <div class="nav-line" data-layer="Nav / top HUD line"></div>
    </header>

    <nav class="mobile-nav" id="mobileNav" aria-label="Мобильная навигация">
      <a href="works.html">Работы</a>
      <a href="about.html">Обо мне</a>
      <a href="process.html">Процесс</a>
      <a href="contacts.html">Контакты</a>
    </nav>

    <main class="frame" id="frame" aria-label="01 — Главная / Pixel Perfect Final">
      <img class="layer reference-locked" src="andyvi-bg-shadow-silhouette-smoke-sharp-v2.png" alt="" aria-hidden="true" data-layer="00_REFERENCE_LOCKED" />

      <img class="layer bg-photo" src="andyvi-bg-shadow-silhouette-smoke-sharp-v2.png" alt="" aria-hidden="true" data-layer="01_BG_IMAGE / BG / portrait + smoke + cinematic texture" />
      <div class="layer right-vignette" data-layer="01_BG_IMAGE / BG / dark right vignette"></div>
      <div class="layer blue-smoke" data-layer="01_BG_IMAGE / BG / blue smoke overlays"></div>
      <div class="layer right-clean-plate" data-layer="01_BG_IMAGE / BG / clean dark text plate"></div>
      <div class="layer grain" data-layer="01_BG_IMAGE / BG / grain noise"></div>

      <section class="hero" data-layer="03_HERO_CONTENT">
        <div class="eyebrow" data-layer="Eyebrow / Привет, я Андрей">ПРИВЕТ, Я АНДРЕЙ</div>
        <div class="eyebrow-rule" data-layer="Eyebrow / horizontal rule"></div>
        <div class="title-glow" data-layer="H1 / glow"></div>
        <h1 class="hero-title" data-layer="H1 / Фронтенд + H1 / Разработчик">
          <span>ФРОНТЕНД</span>
          <span>РАЗРАБОТЧИК</span>
        </h1>
        <div class="glitch-cuts" data-layer="H1 / glitch cuts" aria-hidden="true">
          <i class="cut-1"></i>
          <i class="cut-2"></i>
          <i class="cut-3"></i>
          <i class="cut-4"></i>
          <i class="cut-5"></i>
          <i class="cut-6"></i>
        </div>
        <div class="title-baseline"></div>
        <p class="lead" data-layer="Lead text">Создаю масштабируемые сервисы<br>с фокусом на производительность,<br>архитектуру и качество кода.</p>
      </section>

      <section class="cta-zone" data-layer="04_CTA">
        <button class="cta" id="projectsCta" type="button" aria-label="Смотреть проекты" aria-pressed="false" data-layer="Button frame / Button label / Button arrow">
          <i class="cta-border-orbit" aria-hidden="true"></i>
          <span>СМОТРЕТЬ ПРОЕКТЫ</span>
          <span class="cta-arrow" aria-hidden="true">→</span>
        </button>
      </section>

      <section class="metrics" aria-label="Метрики" data-layer="05_METRICS">
        <div class="metric" data-layer="Metric / 4+">
          <span class="metric-number">4+</span>
          <span class="metric-label">ЛЕТ ОПЫТА</span>
        </div>
        <div class="metric-divider" data-layer="Metric dividers"></div>
        <div class="metric" data-layer="Metric / 10+">
          <span class="metric-number">10+</span>
          <span class="metric-label">ПРОЕКТОВ</span>
        </div>
        <div class="metric-divider" data-layer="Metric dividers"></div>
        <div class="metric" data-layer="Metric / 20+">
          <span class="metric-number">20+</span>
          <span class="metric-label">КЛИЕНТОВ</span>
        </div>
      </section>
      <div class="bottom-hud" data-layer="Bottom HUD line" aria-hidden="true">
        <svg viewBox="0 0 990 45" focusable="false">
          <circle class="hud-dot" cx="8" cy="9" r="2.2"></circle>
          <path class="hud-primary" d="M22 9 H204 L224 9 L244 25 H340 L356 9 H520 M584 9 H768 L790 25 H874 M918 9 H990"></path>
          <path class="hud-soft" d="M390 9 H520 M690 9 H768 M950 9 H990"></path>
          <path class="hud-hatch" d="M808 13 l7 -7 M816 13 l7 -7 M824 13 l7 -7 M832 13 l7 -7 M840 13 l7 -7 M848 13 l7 -7 M856 13 l7 -7 M864 13 l7 -7"></path>
          <circle class="hud-dot" cx="760" cy="9" r="1.4"></circle>
        </svg>
      </div>

      <aside class="right-ruler" aria-label="Индикатор 01–05" data-layer="06_RIGHT_RULER">
        <div class="index top" data-layer="Index / 01">01</div>
        <div class="ruler-line" data-layer="Vertical ruler / Ruler ticks"></div>
        <div class="ruler-block" data-layer="Ruler ticks"></div>
        <div class="ruler-dot" data-layer="Ruler ticks"></div>
        <div class="index bottom" data-layer="Index / 05">05</div>
      </aside>

      <div class="hud-decor" data-layer="07_HUD_DECOR" aria-hidden="true">
        <div class="hud-line left-a"></div>
        <div class="hud-line left-b"></div>
        <div class="hud-line mid-a"></div>
        <div class="hud-line mid-b"></div>
        <div class="circuit c1"></div>
        <div class="circuit c2"></div>
        <div class="tiny-code left">D01<br>D02<br>D03</div>
        <div class="tiny-code center">SYS<br>HUD<br>01</div>
        <div class="dot d1"></div>
        <div class="dot d2"></div>
        <div class="dot d3"></div>
        <div class="dot d4"></div>
      </div>
    </main>
  </div>

  <script>
    (function () {
      const frame = document.getElementById('frame');
      const projectsCta = document.getElementById('projectsCta');
      const logoGlitchTarget = document.querySelector('.logo-word');
      const heroGlitchTarget = document.querySelector('.hero-title span:first-child');
      const heroSecondGlitchTarget = document.querySelector('.hero-title span:nth-child(2)');
      const ctaVisitedKey = 'andyvi:projects-cta-visited';
      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      function navigateWithPageTransition(href) {
        if (!href) return;
        if (reduceMotion) {
          window.location.assign(href);
          return;
        }
        if (document.body.classList.contains('is-page-exiting')) return;
        document.body.classList.remove('is-page-entering');
        document.body.classList.add('is-page-exiting');
        window.setTimeout(() => {
          window.location.assign(href);
        }, 360);
      }

      function shouldUsePageTransition(anchor, event) {
        if (!anchor || event.defaultPrevented || event.button !== 0) return false;
        if (event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return false;
        if (anchor.hasAttribute('download')) return false;
        if (anchor.target && anchor.target !== '_self') return false;

        const rawHref = anchor.getAttribute('href');
        if (!rawHref || rawHref.startsWith('#')) return false;

        let targetUrl;
        try {
          targetUrl = new URL(rawHref, window.location.href);
        } catch (_) {
          return false;
        }

        if (!['http:', 'https:', 'file:'].includes(targetUrl.protocol)) return false;
        if (targetUrl.origin !== window.location.origin) return false;

        const currentUrl = new URL(window.location.href);
        if (targetUrl.pathname === currentUrl.pathname && targetUrl.search === currentUrl.search) return false;
        return /\.html?$/i.test(targetUrl.pathname);
      }

      function wirePageTransitions() {
        if (!reduceMotion) {
          document.body.classList.add('is-page-entering');
          window.setTimeout(() => document.body.classList.remove('is-page-entering'), 700);
        }

        document.addEventListener('click', (event) => {
          const anchor = event.target.closest ? event.target.closest('a[href]') : null;
          if (!shouldUsePageTransition(anchor, event)) return;
          event.preventDefault();
          navigateWithPageTransition(anchor.href);
        });
      }

      wirePageTransitions();

      if (logoGlitchTarget && !reduceMotion) {
        logoGlitchTarget.dataset.glitch = logoGlitchTarget.textContent.trim();
        requestAnimationFrame(() => {
          logoGlitchTarget.classList.add('load-glitch-logo');
          window.setTimeout(() => {
            logoGlitchTarget.classList.remove('load-glitch-logo');
            delete logoGlitchTarget.dataset.glitch;
          }, 1120);
        });
      }

      if (heroGlitchTarget && !reduceMotion) {
        heroGlitchTarget.dataset.glitch = heroGlitchTarget.textContent.trim();
        requestAnimationFrame(() => {
          heroGlitchTarget.classList.add('load-glitch');
          window.setTimeout(() => {
            heroGlitchTarget.classList.remove('load-glitch');
            delete heroGlitchTarget.dataset.glitch;
          }, 1200);
        });
      }

      if (heroSecondGlitchTarget && !reduceMotion) {
        heroSecondGlitchTarget.dataset.glitch = heroSecondGlitchTarget.textContent.trim();
        requestAnimationFrame(() => {
          heroSecondGlitchTarget.classList.add('load-glitch-deep');
          window.setTimeout(() => {
            heroSecondGlitchTarget.classList.remove('load-glitch-deep');
            delete heroSecondGlitchTarget.dataset.glitch;
          }, 1400);
        });
      }

      if (projectsCta) {
        try {
          if (localStorage.getItem(ctaVisitedKey) === 'true') {
            projectsCta.dataset.visited = 'true';
            projectsCta.setAttribute('aria-pressed', 'true');
          }
        } catch (_) {}

        projectsCta.addEventListener('click', () => {
          projectsCta.dataset.visited = 'true';
          projectsCta.setAttribute('aria-pressed', 'true');
          try { localStorage.setItem(ctaVisitedKey, 'true'); } catch (_) {}
          navigateWithPageTransition('works.html');
        });
      }

      const menuButton = document.getElementById('menuButton');
      const mobileNav = document.getElementById('mobileNav');
      if (menuButton && mobileNav) {
        function closeMobileNav() {
          menuButton.setAttribute('aria-expanded', 'false');
          mobileNav.classList.remove('is-open');
        }
        function toggleMobileNav() {
          const isOpen = mobileNav.classList.contains('is-open');
          if (isOpen) closeMobileNav();
          else {
            menuButton.setAttribute('aria-expanded', 'true');
            mobileNav.classList.add('is-open');
          }
        }
        menuButton.addEventListener('click', (e) => { e.stopPropagation(); toggleMobileNav(); });
        document.addEventListener('click', (e) => {
          if (mobileNav.classList.contains('is-open') && !mobileNav.contains(e.target) && !menuButton.contains(e.target)) {
            closeMobileNav();
          }
        });
        document.addEventListener('keydown', (e) => {
          if (e.key === 'Escape' && mobileNav.classList.contains('is-open')) closeMobileNav();
        });
      }

      const topbar = document.querySelector('.topbar');
      function fitFrame() {
        const pad = 0;
        const scale = Math.min((window.innerWidth - pad) / 1920, (window.innerHeight - pad) / 1080);
        const safeScale = Number.isFinite(scale) && scale > 0 ? scale : 1;
        const x = (window.innerWidth - 1920 * safeScale) / 2;
        const y = (window.innerHeight - 1080 * safeScale) / 2;
        const transform = `translate(${x}px, ${y}px) scale(${safeScale})`;
        frame.style.transform = transform;
        if (topbar) topbar.style.transform = transform;
      }

      window.addEventListener('resize', fitFrame);
      fitFrame();
    })();
  </script>
</body>
</html>
